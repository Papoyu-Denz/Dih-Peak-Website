<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Website</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
        }
        nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            margin-left: auto; /* Push the list to the right */
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        .search-bar {
            margin-left: 20px;
        }
        .search-bar input {
            padding: 5px;
            border: none;
            border-radius: 4px;
        }
        .banner {
            background: url('banner.jpg') no-repeat center center/cover;
            height: 50vh;
            display: center;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .button-container {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 10px;
            padding: 10px;
        }
        .button-container::-webkit-scrollbar {
            height: 8px;
        }
        .button-container::-webkit-scrollbar-thumb {
            background-color: #000000;
            border-radius: 4px;
        }
        .button-container::-webkit-scrollbar-track {
            background-color: #f1f1f1;
        }
        .button-container .button {
            flex: 0 0 auto;
            width: 200px;
            height: 100px;
            background-color: #007BFF;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button-container .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Events Website</h1>
                <div class="search-bar">
                  <input type="text" placeholder="Search...">
                </div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#events">Events</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="banner">
    </div>
    <div class="button-container">
        <div class="button" onclick="location.href='#';">Music</div>
        <div class="button" onclick="location.href='#';">Sports</div>
        <div class="button" onclick="location.href='#';">Performing & Visual Arts</div>
        <div class="button" onclick="location.href='#';">Holidays</div>
        <div class="button" onclick="location.href='#';">Dating</div>
        <div class="button" onclick="location.href='#';">Hobbies</div>
        <div class="button" onclick="location.href='#';">Business</div>
        <div class="button" onclick="location.href='#';">Food & Drinks</div>
        </div>
    </div>
</body>
</html>
